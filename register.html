<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Bill With Me</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="auth-container">
    <div class="card auth-card glass-card animate-fade-in" style="max-width: 600px;">
      <div class="auth-header">
        <a href="index.html" class="sidebar-brand text-primary flex items-center justify-center gap-2">
          <img src="images/logo.jpg" alt="Logo" style="width: 32px; height: 32px; border-radius: 8px;">
          <span>Bill With Me</span>
        </a>
        <h2>Create Your Shop</h2>
        <p class="text-muted mt-2">Start your 30-day free trial</p>
      </div>
      <form id="register-form" class="grid grid-cols-2 gap-4">
        <div class="form-group col-span-2">
          <label class="form-label">Shop Name</label>
          <input type="text" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Owner Name</label>
          <input type="text" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input type="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg mt-4" style="grid-column: span 2;">Create Account</button>
      </form>
      <div class="text-center mt-6">
        <p class="text-muted">Already have an account? <a href="login.html" class="text-primary font-bold">Login here</a></p>
      </div>
    </div>
  </div>
  <script>lucide.createIcons(); document.getElementById('register-form').addEventListener('submit', function(e) { e.preventDefault(); const shopName = this.querySelector('input[type="text"]').value; localStorage.setItem('shopName', shopName); window.location.href = 'shop-dashboard.html'; });</script>
</body>
</html>
