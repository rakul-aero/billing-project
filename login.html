<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Bill With Me</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-color) 0%, #E0E7FF 100%);
      padding: 2rem;
    }
    .auth-card {
      width: 100%;
      max-width: 450px;
      padding: 2.5rem;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header h2 {
      margin-top: 1rem;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="card auth-card glass-card animate-fade-in">
      <div class="auth-header">
        <a href="index.html" class="sidebar-brand text-primary flex items-center justify-center gap-2">
          <img src="images/logo.jpg" alt="Logo" style="width: 32px; height: 32px; border-radius: 8px;">
          <span>Bill With Me</span>
        </a>
        <h2>Welcome Back</h2>
        <p class="text-muted mt-2">Sign in to manage your shop</p>
      </div>
      
      <form id="login-form">
        <div class="form-group">
          <label class="form-label">User ID / Email</label>
          <input type="text" class="form-control" placeholder="Enter your ID or email" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" placeholder="Enter your password" required>
        </div>
        
        <div class="form-group flex justify-between items-center mt-4">
          <label class="flex items-center" style="gap: 0.5rem; font-size: 0.875rem;">
            <input type="checkbox"> Remember me
          </label>
          <a href="forgot-password.html" class="text-primary" style="font-size: 0.875rem; font-weight: 500;">Forgot Password?</a>
        </div>
        
        <button type="submit" class="btn btn-primary w-full mt-4 btn-lg">Login to Dashboard</button>
      </form>
      
      <div class="text-center mt-6">
        <p class="text-muted" style="font-size: 0.875rem;">
          Don't have an account? <a href="register.html" class="text-primary" style="font-weight: 600;">Register here</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    lucide.createIcons();
    
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      // Mock login: Redirect to dashboard
      window.location.href = 'shop-dashboard.html';
    });
  </script>
</body>
</html>
