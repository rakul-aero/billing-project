<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reports - Bill With Me</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-layout" id="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="shop-dashboard.html" class="sidebar-brand flex items-center gap-2">
          <img src="images/logo.jpg" alt="Logo" style="width: 28px; height: 28px; border-radius: 6px;">
          <span>Bill With Me</span>
        </a>
      </div>
      <div class="sidebar-nav">
        <div class="nav-item"><a href="shop-dashboard.html" class="nav-link"><i data-lucide="layout-dashboard"></i> Dashboard</a></div>
        <div class="nav-item"><a href="shop-billing.html" class="nav-link"><i data-lucide="calculator"></i> Billing POS</a></div>
        <div class="nav-item"><a href="shop-products.html" class="nav-link"><i data-lucide="shopping-cart"></i> Products</a></div>
        <div class="nav-item"><a href="shop-customers.html" class="nav-link"><i data-lucide="users"></i> Customers</a></div>
        <div class="nav-item"><a href="shop-inventory.html" class="nav-link"><i data-lucide="package"></i> Inventory</a></div>
        <div class="nav-item"><a href="shop-expenses.html" class="nav-link"><i data-lucide="indian-rupee"></i> Expenses</a></div>
        <div class="nav-item"><a href="shop-reports.html" class="nav-link active"><i data-lucide="file-text"></i> Reports</a></div>
        <div class="nav-item"><a href="shop-analytics.html" class="nav-link"><i data-lucide="pie-chart"></i> Analytics</a></div>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar"><h2 style="font-size: 1.25rem;">Reports</h2></header>
      <div class="content-area">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 animate-fade-in">
          <div class="card p-6 shadow-md text-center">
            <i data-lucide="download" class="text-primary mb-4" style="width: 48px; height: 48px; margin: 0 auto;"></i>
            <h3>Sales Report (PDF)</h3>
            <p class="text-muted mt-2 mb-4">Export your monthly sales data for your CA.</p>
            <button class="btn btn-outline">Generate</button>
          </div>
          <div class="card p-6 shadow-md text-center">
            <i data-lucide="file-spreadsheet" class="text-accent mb-4" style="width: 48px; height: 48px; margin: 0 auto;"></i>
            <h3>GST Report (Excel)</h3>
            <p class="text-muted mt-2 mb-4">Detailed GST breakdown for filing returns.</p>
            <button class="btn btn-outline">Generate</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="js/main.js"></script><script>lucide.createIcons();</script>
</body>
</html>
