<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password - Bill With Me</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="auth-container">
    <div class="card auth-card glass-card animate-fade-in">
      <div class="auth-header">
        <a href="index.html" class="sidebar-brand text-primary flex items-center justify-center gap-2">
          <img src="images/logo.jpg" alt="Logo" style="width: 32px; height: 32px; border-radius: 8px;">
          <span>Bill With Me</span>
        </a>
        <h2>Reset Password</h2>
        <p class="text-muted mt-2">Enter your phone or email to get a reset link</p>
      </div>
      <form>
        <div class="form-group">
          <label class="form-label">Phone / Email</label>
          <input type="text" class="form-control" required>
        </div>
        <button class="btn btn-primary w-full mt-4 btn-lg">Send Reset OTP</button>
      </form>
      <div class="text-center mt-6">
        <p class="text-muted">Remembered? <a href="login.html" class="text-primary font-bold">Back to Login</a></p>
      </div>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
